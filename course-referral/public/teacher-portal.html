<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Digitals Academy — Teacher Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2d5a27;--accent-light:#edf5ec;--accent-text:#1e4019;
  --gold:#c4860a;--gold-light:#fdf6e3;
  --bg:#f8f9f7;--surface:#fff;--border:#e5e7e3;
  --text:#1a1a1a;--muted:#6b7280;
  --danger:#c0392b;--danger-light:#fdf0ee;
  --radius:10px;--radius-lg:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
/* Header */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'DM Serif Display',serif;font-size:18px;color:var(--accent)}
.header-right{display:flex;align-items:center;gap:12px}
.teacher-badge{background:var(--accent-light);color:var(--accent-text);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:400px}
.login-card h1{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:14px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--radius);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid #f0c0bb}
.btn-danger:hover{background:#f9e0dd}
.btn-gold{background:var(--gold-light);color:var(--gold);border:1px solid #f0d890}
.btn-gold:hover{background:#fbeec0}
.btn-full{width:100%;justify-content:center}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block}
.alert-danger{background:var(--danger-light);color:var(--danger);border:1px solid #f0c0bb}
/* Main layout */
.main{max-width:1100px;margin:0 auto;padding:28px 20px}
.page-title{font-family:'DM Serif Display',serif;font-size:26px;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:24px}
.tab{padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1.5px;font-family:inherit;transition:.15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-weight:700;font-size:15px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:800;color:var(--accent)}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:2px}
/* Session list */
.session-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.session-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.session-num{background:var(--accent-light);color:var(--accent-text);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.session-title{font-weight:600;font-size:15px}
.session-desc{color:var(--muted);font-size:13px;margin-bottom:12px}
.session-actions{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#edf5ec;color:#1e4019}
.badge-gray{background:#f3f4f6;color:#6b7280}
/* Codes grid */
.codes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:12px}
.code-chip{background:var(--gold-light);border:1px solid #f0d890;border-radius:8px;padding:10px 12px;text-align:center;position:relative}
.code-chip.used{background:#f3f4f6;border-color:#e5e7e3;opacity:.7}
.code-chip .code-val{font-family:monospace;font-size:16px;font-weight:800;letter-spacing:2px;color:var(--gold)}
.code-chip.used .code-val{color:var(--muted)}
.code-chip .code-status{font-size:10px;color:var(--muted);margin-top:2px}
.code-chip .code-used-by{font-size:10px;color:var(--accent);margin-top:2px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal h3{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:8px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-card">
      <h1>Teacher Portal</h1>
      <p>Ghost Digitals Academy — Instructor Access</p>
      <div class="alert alert-danger" id="login-alert"></div>
      <div class="field"><label>Username</label><input type="text" id="login-username" placeholder="digital / event / ai"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" placeholder="Your teacher password"></div>
      <button class="btn btn-primary btn-full" onclick="teacherLogin()">
        <span id="login-btn-text">Sign In</span>
        <div class="spinner" id="login-spinner"></div>
      </button>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen" style="display:none">
  <div class="header">
    <div class="logo">GhostDigitals Academy</div>
    <div class="header-right">
      <div class="teacher-badge" id="teacher-badge">👨‍🏫 Teacher</div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="main">
    <div class="page-title" id="page-title">Teacher Dashboard</div>
    <div class="page-sub" id="page-sub">Manage your sessions and generate class codes</div>

    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="stat-sessions">0</div><div class="stat-lbl">Total Sessions</div></div>
      <div class="stat"><div class="stat-num" id="stat-codes">0</div><div class="stat-lbl">Codes Generated</div></div>
      <div class="stat"><div class="stat-num" id="stat-used">0</div><div class="stat-lbl">Codes Used</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('sessions',this)">📚 Sessions</button>
      <button class="tab" onclick="switchTab('codes',this)">🔑 Class Codes</button>
    </div>

    <!-- SESSIONS TAB -->
    <div class="tab-content active" id="tab-sessions">
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
        <button class="btn btn-primary" onclick="openNewSessionModal()">+ New Session</button>
      </div>
      <div id="sessions-list"><div class="empty"><div class="empty-icon">📚</div>No sessions yet. Create your first session!</div></div>
    </div>

    <!-- CODES TAB -->
    <div class="tab-content" id="tab-codes">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Generate Class Codes</div>
        </div>
        <div class="field">
          <label>Select Session</label>
          <select id="code-session-select">
            <option value="">— Choose a session —</option>
          </select>
        </div>
        <div class="field">
          <label>Number of Codes</label>
          <input type="number" id="code-count" value="20" min="1" max="100">
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="generateCodes()">🔑 Generate Codes</button>
          <button class="btn btn-danger" onclick="deactivateSessionCodes()">🚫 Deactivate All for Session</button>
        </div>
      </div>

      <div id="codes-display"></div>
    </div>
  </div>
</div>

<!-- New Session Modal -->
<div class="modal-overlay" id="session-modal" onclick="closeModalIf(event,'session-modal')">
  <div class="modal">
    <h3>Create New Session</h3>
    <div class="alert alert-danger" id="session-alert"></div>
    <div class="field"><label>Session Title *</label><input type="text" id="s-title" placeholder="e.g. Introduction to Social Media Marketing"></div>
    <div class="field"><label>Session Number</label><input type="number" id="s-number" placeholder="Auto-assigned if empty" min="1"></div>
    <div class="field"><label>Description</label><textarea id="s-desc" placeholder="What will students learn in this session?"></textarea></div>
    <div class="field">
      <label>Materials (one per line)</label>
      <textarea id="s-materials" rows="5" placeholder="Slide deck: https://...&#10;Reading: Chapter 3 of textbook&#10;Watch: https://youtube.com/..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('session-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="createSession()" id="create-session-btn">
        <span id="create-session-text">Create Session</span>
        <div class="spinner" id="create-session-spinner"></div>
      </button>
    </div>
  </div>
</div>

<script>
let teacherData = null;
let sessions = [];
let codes = [];

// ── Auth ──────────────────────────────────────────────────
async function teacherLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const alert = document.getElementById('login-alert');
  const btn = document.getElementById('login-btn-text');
  const spinner = document.getElementById('login-spinner');

  if (!username || !password) { showAlert(alert, 'Please enter your username and password'); return; }

  btn.textContent = 'Signing in...'; spinner.style.display = 'block';
  try {
    const res = await fetch('/api/sessions?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Invalid credentials');

    teacherData = data;
    localStorage.setItem('teacherSession', JSON.stringify(data));
    showApp();
  } catch(e) {
    showAlert(alert, e.message);
  }
  btn.textContent = 'Sign In'; spinner.style.display = 'none';
}

function logout() {
  teacherData = null;
  localStorage.removeItem('teacherSession');
  document.getElementById('login-screen').style.display = '';
  document.getElementById('app-screen').style.display = 'none';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = '';
  document.getElementById('teacher-badge').textContent = `👨‍🏫 ${teacherData.label} Teacher`;
  document.getElementById('page-title').textContent = `${teacherData.label} — Teacher Portal`;
  document.getElementById('page-sub').textContent = 'Manage your sessions and generate class codes';
  loadData();
}

// ── Data ──────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('/api/sessions', {
      headers: { 'x-teacher-key': teacherData.username }
    });
    const data = await res.json();
    sessions = data.sessions || [];
    codes    = data.codes || [];
    renderAll();
  } catch(e) { console.error(e); }
}

function renderAll() {
  renderStats();
  renderSessions();
  renderCodesTab();
}

function renderStats() {
  document.getElementById('stat-sessions').textContent = sessions.length;
  document.getElementById('stat-codes').textContent = codes.length;
  document.getElementById('stat-used').textContent = codes.filter(c => c.usedBy).length;
}

function renderSessions() {
  const el = document.getElementById('sessions-list');
  if (!sessions.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📚</div>No sessions yet. Create your first session!</div>';
    return;
  }
  el.innerHTML = [...sessions].reverse().map(s => {
    const sessionCodes = codes.filter(c => c.sessionId === s.id);
    const usedCodes = sessionCodes.filter(c => c.usedBy).length;
    return `
    <div class="session-item">
      <div class="session-header">
        <div>
          <span class="session-num">Session ${s.sessionNumber}</span>
          <div class="session-title" style="margin-top:6px">${s.title}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
          <span class="badge ${s.active ? 'badge-green' : 'badge-gray'}">${s.active ? '● Active' : '○ Inactive'}</span>
        </div>
      </div>
      ${s.description ? `<div class="session-desc">${s.description}</div>` : ''}
      ${s.materials?.length ? `
        <div style="margin-bottom:12px">
          <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px">MATERIALS</div>
          ${s.materials.map(m => `<div style="font-size:13px;color:var(--text);margin-bottom:3px">• ${m.startsWith('http') ? `<a href="${m}" target="_blank" style="color:var(--accent)">${m}</a>` : m}</div>`).join('')}
        </div>` : ''}
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">🔑 ${sessionCodes.length} codes generated · ${usedCodes} used</div>
      <div class="session-actions">
        <button class="btn btn-gold" onclick="quickGenerateCodes('${s.id}')">🔑 Generate Codes</button>
        <button class="btn btn-outline" onclick="toggleSession('${s.id}')">
          ${s.active ? '⏸ Deactivate' : '▶ Activate'}
        </button>
        <button class="btn btn-danger" onclick="deactivateCodesForSession('${s.id}')">🚫 Kill All Codes</button>
      </div>
    </div>`;
  }).join('');
}

function renderCodesTab() {
  // Update session select
  const sel = document.getElementById('code-session-select');
  const current = sel.value;
  sel.innerHTML = '<option value="">— Choose a session —</option>' +
    sessions.map(s => `<option value="${s.id}" ${s.id === current ? 'selected' : ''}>Session ${s.sessionNumber}: ${s.title}</option>`).join('');

  // Show codes for selected session
  const selectedId = sel.value;
  if (selectedId) showCodesForSession(selectedId);
}

function showCodesForSession(sessionId) {
  const sessionCodes = codes.filter(c => c.sessionId === sessionId);
  const el = document.getElementById('codes-display');
  if (!sessionCodes.length) { el.innerHTML = ''; return; }

  const active = sessionCodes.filter(c => c.active && !c.usedBy);
  const used   = sessionCodes.filter(c => c.usedBy);
  const dead   = sessionCodes.filter(c => !c.active && !c.usedBy);

  el.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">
        ${sessionCodes.length} codes total · <span style="color:var(--accent)">${active.length} available</span> · ${used.length} used · ${dead.length} deactivated
      </div>
      <div class="codes-grid">
        ${sessionCodes.map(c => `
          <div class="code-chip ${c.usedBy || !c.active ? 'used' : ''}">
            <div class="code-val">${c.code}</div>
            <div class="code-status">${!c.active ? 'Deactivated' : c.usedBy ? '' : 'Available'}</div>
            ${c.usedBy ? '<div class="code-used-by">✓ Used</div>' : ''}
          </div>`).join('')}
      </div>
    </div>`;
}

// ── Actions ───────────────────────────────────────────────
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function openNewSessionModal() {
  document.getElementById('session-modal').classList.add('open');
  document.getElementById('s-title').focus();
}

async function createSession() {
  const title = document.getElementById('s-title').value.trim();
  const desc  = document.getElementById('s-desc').value.trim();
  const num   = document.getElementById('s-number').value;
  const mats  = document.getElementById('s-materials').value.trim()
    .split('\n').map(m => m.trim()).filter(Boolean);
  const alert = document.getElementById('session-alert');

  if (!title) { showAlert(alert, 'Session title is required'); return; }

  const btn = document.getElementById('create-session-btn');
  const spinner = document.getElementById('create-session-spinner');
  btn.disabled = true; spinner.style.display = 'block';
  document.getElementById('create-session-text').textContent = 'Creating...';

  try {
    const res = await fetch('/api/sessions?action=create-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-teacher-key': teacherData.username },
      body: JSON.stringify({ title, description: desc, materials: mats, sessionNumber: num ? parseInt(num) : undefined })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    sessions.push(data.session);
    closeModal('session-modal');
    document.getElementById('s-title').value = '';
    document.getElementById('s-desc').value = '';
    document.getElementById('s-number').value = '';
    document.getElementById('s-materials').value = '';
    renderAll();
  } catch(e) { showAlert(alert, e.message); }

  btn.disabled = false; spinner.style.display = 'none';
  document.getElementById('create-session-text').textContent = 'Create Session';
}

async function generateCodes() {
  const sessionId = document.getElementById('code-session-select').value;
  const count = parseInt(document.getElementById('code-count').value) || 20;
  if (!sessionId) { alert('Please select a session first'); return; }
  await doGenerateCodes(sessionId, count);
}

async function quickGenerateCodes(sessionId) {
  const count = parseInt(prompt('How many codes to generate?', '20'));
  if (!count || count < 1) return;
  await doGenerateCodes(sessionId, count);
  switchTab('codes', document.querySelectorAll('.tab')[1]);
  document.getElementById('code-session-select').value = sessionId;
  showCodesForSession(sessionId);
}

async function doGenerateCodes(sessionId, count) {
  try {
    const res = await fetch('/api/sessions?action=generate-codes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-teacher-key': teacherData.username },
      body: JSON.stringify({ sessionId, count })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    codes = [...codes, ...data.codes];
    renderAll();
    showCodesForSession(sessionId);
  } catch(e) { alert(e.message); }
}

async function toggleSession(sessionId) {
  try {
    const res = await fetch('/api/sessions?action=toggle-session', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-teacher-key': teacherData.username },
      body: JSON.stringify({ sessionId })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    const s = sessions.find(s => s.id === sessionId);
    if (s) s.active = data.active;
    renderAll();
  } catch(e) { alert(e.message); }
}

async function deactivateCodesForSession(sessionId) {
  if (!confirm('Deactivate all unused codes for this session? Students who already used a code can still access the content.')) return;
  try {
    await fetch('/api/sessions?action=deactivate-codes', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-teacher-key': teacherData.username },
      body: JSON.stringify({ sessionId })
    });
    codes = codes.map(c => c.sessionId === sessionId && !c.usedBy ? { ...c, active: false } : c);
    renderAll();
  } catch(e) { alert(e.message); }
}

async function deactivateSessionCodes() {
  const sessionId = document.getElementById('code-session-select').value;
  if (!sessionId) { alert('Please select a session first'); return; }
  await deactivateCodesForSession(sessionId);
}

// ── Helpers ───────────────────────────────────────────────
function showAlert(el, msg) { el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 4000); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeModalIf(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

// Auto login from localStorage
const saved = localStorage.getItem('teacherSession');
if (saved) {
  try {
    teacherData = JSON.parse(saved);
    showApp();
  } catch(e) { localStorage.removeItem('teacherSession'); }
}
</script>
</body>
</html>

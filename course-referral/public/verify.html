<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate — Ghost Digitals Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#2d5a27;--accent-light:#e8f4e6;--accent-dark:#1e4019;--bg:#f6f8f5;--surface:#fff;--border:#eaeee7;--text:#111a15;--muted:#8a9a8e;--danger:#c0392b;--danger-light:#fdf0ee;--radius-lg:18px;--shadow-md:0 4px 16px rgba(20,40,15,.07);--shadow-lg:0 20px 48px rgba(20,40,15,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(900px 500px at 100% -10%,var(--accent-light),transparent),var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 36px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);text-align:center}
.logo{width:70px;height:70px;margin:0 auto 18px;object-fit:contain}
h1{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:28px}
.icon-badge{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.icon-badge.valid{background:var(--accent-light)}
.icon-badge.invalid{background:var(--danger-light)}
.icon-badge svg{width:32px;height:32px;stroke-width:2;fill:none}
.icon-badge.valid svg{stroke:var(--accent)}
.icon-badge.invalid svg{stroke:var(--danger)}
.status{font-size:18px;font-weight:800;margin-bottom:20px}
.status.valid{color:var(--accent)}
.status.invalid{color:var(--danger)}
.details{background:var(--bg);border-radius:12px;padding:18px 20px;text-align:left;margin-top:4px}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .k{color:var(--muted)}
.row .v{font-weight:600;text-align:right}
.loading{color:var(--muted);font-size:14px;padding:20px 0}
</style>
</head>

  <h1>Ghost Digitals Academy</h1>
  <div class="sub">Certificate Verification</div>
  <div id="result"><div class="loading">Checking certificate…</div></div>
</div>
<script>
async function verify(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code')||'';
  const resultEl=document.getElementById('result');
  if(!code){
    resultEl.innerHTML='<div class="icon-badge invalid"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></div><div class="status invalid">No certificate code provided</div>';
    return;
  }
  try{
    const res=await fetch('/api/sessions?action=verify-certificate&code='+encodeURIComponent(code));
    const d=await res.json();
    if(!d.valid){
      resultEl.innerHTML='<div class="icon-badge invalid"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></div><div class="status invalid">Certificate not found</div><div style="color:var(--muted);font-size:13px">This code does not match any issued certificate.</div>';
      return;
    }
    const c=d.certificate;
    const date=new Date(c.issuedAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    resultEl.innerHTML='<div class="icon-badge valid"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>'
      +'<div class="status valid">Valid Certificate</div>'
      +'<div class="details">'
      +'<div class="row"><span class="k">Student</span><span class="v">'+escapeHtml(c.studentName)+'</span></div>'
      +'<div class="row"><span class="k">Course</span><span class="v">'+escapeHtml(c.courseLabel)+'</span></div>'
      +'<div class="row"><span class="k">Issued</span><span class="v">'+date+'</span></div>'
      +'<div class="row"><span class="k">Instructor</span><span class="v">'+escapeHtml(c.teacherName)+'</span></div>'
      +'<div class="row"><span class="k">Certificate No.</span><span class="v">'+escapeHtml(c.code)+'</span></div>'
      +'</div>';
  }catch(e){
    resultEl.innerHTML='<div class="icon-badge invalid"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></div><div class="status invalid">Could not verify</div><div style="color:var(--muted);font-size:13px">Please try again later.</div>';
  }
}
function escapeHtml(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
verify();
</script>

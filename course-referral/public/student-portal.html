<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Digitals Academy — Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--accent:#2d5a27;--accent-light:#edf5ec;--accent-text:#1e4019;--gold:#c4860a;--gold-light:#fdf6e3;--bg:#f8f9f7;--surface:#fff;--border:#e5e7e3;--text:#1a1a1a;--muted:#6b7280;--danger:#c0392b;--danger-light:#fdf0ee;--radius:10px;--radius-lg:14px;--shadow-sm:0 1px 3px rgba(20,40,15,.05);--shadow-md:0 8px 26px rgba(20,40,15,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
@media print{body{display:none!important}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block}
.alert-danger{background:var(--danger-light);color:var(--danger);border:1px solid #f0c0bb}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff;width:100%}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1a2d18 0%,#2d5a27 100%)}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{width:60px;height:60px;margin:0 auto 14px;border-radius:16px;background:var(--accent-light);display:flex;align-items:center;justify-content:center}
.login-logo svg{width:32px;height:32px;stroke:var(--accent);stroke-width:2;fill:none}
.login-card h1{font-family:'DM Serif Display',serif;font-size:24px;color:var(--accent);margin-bottom:6px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:28px}
.login-card input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:16px;text-align:center;letter-spacing:2px;font-weight:600;margin-bottom:16px;outline:none}
.login-card input:focus{border-color:var(--accent)}
/* Header */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar .who{display:flex;align-items:center;gap:12px}
.topbar .av{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.topbar .nm{font-weight:700;font-size:15px}
.topbar .id{font-size:12px;color:var(--muted);font-family:monospace}
.logout{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.logout:hover{color:var(--danger);border-color:var(--danger)}
.wrap{max-width:900px;margin:0 auto;padding:26px 22px}
.hero{background:linear-gradient(135deg,#2d5a27,#1e4019);border-radius:var(--radius-lg);padding:24px;color:#fff;margin-bottom:24px}
.hero h2{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:4px}
.hero p{font-size:13.5px;opacity:.85}
.snav{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:22px;overflow-x:auto}
.snav-btn{flex:1;min-width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border:none;background:none;border-radius:10px;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.13s}
.snav-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.snav-btn.active{background:var(--accent-light);color:var(--accent-text)}
.s-tab{display:none}.s-tab.active{display:block}
/* Sidebar shell */
.s-shell{display:flex;min-height:100vh}
.s-sidebar{width:246px;background:var(--surface);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.s-sb-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:11px}
.s-sb-brand .mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:17px;flex-shrink:0}
.s-sb-brand .txt strong{display:block;font-family:'DM Serif Display',serif;font-size:16px;line-height:1.15}
.s-sb-brand .txt span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.s-sb-sec{padding:6px 14px;font-size:10.5px;font-weight:700;color:var(--muted);opacity:.65;text-transform:uppercase;letter-spacing:.07em;margin-top:12px}
.s-nav{padding:6px 12px;flex:1;overflow-y:auto}
.snav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:11px;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;margin-bottom:2px;transition:.13s;cursor:pointer;border:none;background:none;text-align:left;position:relative}
.snav-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.snav-btn:hover{background:var(--bg);color:var(--text)}
.snav-btn.active{background:var(--accent-light);color:var(--accent-text)}
.snav-btn.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3.5px;border-radius:0 4px 4px 0;background:var(--accent)}
.s-sb-foot{padding:12px;border-top:1px solid var(--border)}
.s-sb-foot .who{display:flex;align-items:center;gap:10px;padding:6px 8px;margin-bottom:4px}
.s-sb-foot .av{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.s-sb-foot .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-sb-foot .id{font-size:11px;color:var(--muted);font-family:monospace}
.s-logout{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:11px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.13s}
.s-logout svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-logout:hover{color:var(--danger);background:var(--danger-light)}
.s-main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.s-topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;gap:12px}
.s-topbar h2{font-family:'DM Serif Display',serif;font-size:19px;font-weight:400}
.s-topbar .sub{font-size:12px;color:var(--muted)}
.s-menu-btn{display:none;width:40px;height:40px;border-radius:11px;background:var(--bg);border:1px solid var(--border);align-items:center;justify-content:center;cursor:pointer}
.s-menu-btn svg{width:22px;height:22px;stroke:var(--text);stroke-width:2;fill:none}
.s-sb-backdrop{display:none;position:fixed;inset:0;background:rgba(20,25,15,.4);z-index:35}
.s-sb-backdrop.show{display:block}
.main{padding:26px;flex:1}
.s-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.s-stats .stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-sm)}
.s-stats .stat-num{font-family:'DM Serif Display',serif;font-size:28px}
.s-stats .stat-lbl{font-size:12.5px;color:var(--muted)}
.s-stats .tile{width:48px;height:48px;border-radius:14px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center}
.s-stats .tile svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none}
.s-stats .tile.gold{background:var(--gold-light);color:var(--gold)}.s-stats .tile.blue{background:var(--info-light);color:var(--info)}
.s-tab{display:none}.s-tab.active{display:block}
@media(max-width:900px){
  .s-sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .s-sidebar.open{transform:translateX(0)}
  .s-menu-btn{display:flex}
  .s-stats{grid-template-columns:1fr}
}
.mk-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.mk-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mk-bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px}
.mk-bar-fill{height:100%;border-radius:6px}
.prof-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);font-size:14px}
.prof-row:last-child{border-bottom:none}
.prof-row .k{color:var(--muted)}.prof-row .v{font-weight:600}
.announce{background:var(--gold-light);border:1px solid #f0e0b0;border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px}
.announce svg{width:18px;height:18px;stroke:var(--gold);stroke-width:2;fill:none;flex-shrink:0;margin-top:1px}
.sec-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 12px}
.module{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.module-head{padding:16px 20px;border-bottom:1px solid var(--border)}
.module-head h3{font-size:16px;font-weight:700}
.module-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
.sess{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.sess:last-child{border-bottom:none}
.sess:hover{background:var(--bg)}
.sess.locked{opacity:.55;cursor:not-allowed}
.sess-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sess-ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.sess .info{flex:1;min-width:0}
.sess .info h4{font-size:14.5px;font-weight:600}
.sess .info .meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px}
.sess-arrow{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.pill-locked{background:#f3f4f6;color:#6b7280}
.pill-open{background:var(--accent-light);color:var(--accent-text)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;stroke:#c9d2c2;stroke-width:1.5;fill:none;margin-bottom:10px}
/* Session viewer overlay */
.overlay{position:fixed;inset:0;background:rgba(15,20,12,.6);z-index:100;display:none;align-items:stretch;justify-content:center}
.overlay.open{display:flex}
.viewer{background:var(--bg);width:100%;max-width:1000px;display:flex;flex-direction:column;height:100vh}
.viewer-head{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.viewer-head .back{background:none;border:1px solid var(--border);padding:8px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
.viewer-head h3{font-size:16px;font-weight:700;flex:1}
.att-badge{background:var(--accent-light);color:var(--accent-text);padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.att-badge svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none}
.viewer-body{flex:1;overflow-y:auto;padding:22px}
.content-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:18px;line-height:1.65;font-size:14.5px;white-space:pre-wrap}
.pdf-wrap{background:#525659;border-radius:var(--radius-lg);overflow:hidden}
.pdf-bar{background:#323639;padding:9px 16px;display:flex;align-items:center;gap:10px}
.pdf-bar span{color:rgba(255,255,255,.75);font-size:12.5px}
.pdf-bar button{background:rgba(255,255,255,.12);color:#fff;border:none;padding:6px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit}
.pdf-bar button:hover{background:rgba(255,255,255,.22)}
.pdf-bar button:disabled{opacity:.4;cursor:not-allowed}
.pdf-canvas-wrap{display:flex;justify-content:center;padding:18px;min-height:300px}
.pdf-canvas-wrap canvas{max-width:100%;box-shadow:0 4px 20px rgba(0,0,0,.4);height:auto}
.limit-note{text-align:center;color:var(--gold);font-size:12.5px;padding:10px;background:rgba(196,134,10,.08)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo"><svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/></svg></div>
      <h1>Student Portal</h1>
      <p>Ghost Digitals Academy</p>
      <div class="alert alert-danger" id="login-alert"></div>
      <input type="text" id="portal-id-input" placeholder="GDA-XXXXXX" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')login()">
      <button class="btn btn-primary" onclick="login()"><span id="login-text">Enter Portal</span><div class="spinner" id="login-spinner"></div></button>
    </div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <div class="s-shell">
    <aside class="s-sidebar" id="s-sidebar">
      <div class="s-sb-brand"><div class="mark">GD</div><div class="txt"><strong>GhostDigitals</strong><span>Student Portal</span></div></div>
      <nav class="s-nav">
        <div class="s-sb-sec">Learning</div>
        <button class="snav-btn active" onclick="showStudentTab('learn',this)"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Learn</span></button>
        <button class="snav-btn" onclick="showStudentTab('marks',this)"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg><span>Marks</span></button>
        <button class="snav-btn" onclick="showStudentTab('attendance',this)"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>Attendance</span></button>
        <div class="s-sb-sec">Communication</div>
        <button class="snav-btn" onclick="showStudentTab('messages',this)"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Messages</span></button>
        <button class="snav-btn" onclick="showStudentTab('profile',this)"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></button>
      </nav>
      <div class="s-sb-foot">
        <div class="who"><div class="av" id="h-av">S</div><div style="flex:1;min-width:0"><div class="nm" id="h-name">Student</div><div class="id" id="h-id">GDA-000000</div></div></div>
        <button class="s-logout" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Sign out</span></button>
      </div>
    </aside>
    <div class="s-sb-backdrop" id="s-sb-backdrop" onclick="closeStudentSidebar()"></div>

    <div class="s-main-col">
      <header class="s-topbar">
        <button class="s-menu-btn" onclick="toggleStudentSidebar()"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div><h2 id="page-title">Learn</h2><span class="sub" id="page-sub">Your modules and sessions</span></div>
      </header>
      <div class="main">

    <!-- LEARN -->
    <div class="s-tab active" id="s-learn">
      <div id="s-stats" class="s-stats"></div>
      <div id="announce-wrap"></div>
      <div class="sec-label">Your Modules</div>
      <div id="modules-wrap"><div class="empty">Loading…</div></div>
    </div>

    <!-- MARKS -->
    <div class="s-tab" id="s-marks">
      <div id="marks-body"><div class="empty">Loading…</div></div>
    </div>

    <!-- ATTENDANCE -->
    <div class="s-tab" id="s-attendance">
      <div id="attendance-body"><div class="empty">Loading…</div></div>
    </div>

    <!-- MESSAGES -->
    <div class="s-tab" id="s-messages">
      <div class="module" style="display:flex;flex-direction:column;height:66vh">
        <div class="module-head"><h3>Message your teacher</h3><p>Ask questions and get replies</p></div>
        <div id="s-msg-bubbles" style="flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px"></div>
        <div style="display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border)">
          <input type="text" id="s-msg-input" placeholder="Type your message…" style="flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px" onkeydown="if(event.key==='Enter')sendStudentMessage()">
          <button class="btn" style="background:var(--accent);color:#fff;width:auto" onclick="sendStudentMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="s-tab" id="s-profile">
      <div id="profile-body"></div>
    </div>

      </div>
    </div>
  </div>
</div>

<!-- Session viewer -->
<div class="overlay" id="viewer-overlay">
  <div class="viewer">
    <div class="viewer-head">
      <button class="back" onclick="closeViewer()">← Back</button>
      <h3 id="v-title">Session</h3>
      <span class="att-badge" id="v-att" style="display:none"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> Attendance marked</span>
    </div>
    <div class="viewer-body">
      <div id="v-content" class="content-box" style="display:none"></div>
      <div id="v-pdf" class="pdf-wrap" style="display:none">
        <div class="pdf-bar">
          <span id="pdf-info">Page 1</span>
          <span style="flex:1"></span>
          <button id="pdf-prev" onclick="pdfPrev()">◀ Prev</button>
          <button id="pdf-next" onclick="pdfNext()">Next ▶</button>
        </div>
        <div class="pdf-canvas-wrap"><canvas id="pdf-canvas"></canvas></div>
        <div class="limit-note" id="pdf-limit-note" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
function escapeHtml(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function showAlert(el,msg){el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4000);}
let student=null, modules=[], sessions=[];

async function login(){
  const portalId=document.getElementById('portal-id-input').value.trim().toUpperCase();
  const alertEl=document.getElementById('login-alert');
  const txt=document.getElementById('login-text'), sp=document.getElementById('login-spinner');
  if(!portalId){ showAlert(alertEl,'Please enter your Student ID'); return; }
  txt.textContent='Entering…'; sp.style.display='block';
  try{
    const res=await fetch('/api/sessions?action=portal-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({portalId})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Student ID not found');
    student=data.student;
    localStorage.setItem('studentPortalSession',JSON.stringify({student}));
    showApp();
  }catch(e){ showAlert(alertEl,e.message); }
  txt.textContent='Enter Portal'; sp.style.display='none';
}
function logout(){ student=null; localStorage.removeItem('studentPortalSession'); document.getElementById('login-screen').style.display=''; document.getElementById('app-screen').style.display='none'; }
function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='';
  document.getElementById('h-name').textContent=student.name;
  document.getElementById('h-id').textContent=student.portalId;
  document.getElementById('h-av').textContent=(student.name||'?').trim().charAt(0).toUpperCase();
  loadModules(); loadAnnouncements(); loadStatCards();
}
async function loadStatCards(){
  const el=document.getElementById('s-stats');
  if(!el) return;
  const p=await loadProgress();
  const modCount=modules.length;
  const overall=p&&p.overall!=null?p.overall+'%':'—';
  const att=p&&p.attRate!=null?p.attRate+'%':'—';
  el.innerHTML=`
    <div class="stat"><div><div class="stat-num">${modCount}</div><div class="stat-lbl">Modules</div></div><div class="tile"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div></div>
    <div class="stat"><div><div class="stat-num">${overall}</div><div class="stat-lbl">Overall grade</div></div><div class="tile gold"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></div></div>
    <div class="stat"><div><div class="stat-num">${att}</div><div class="stat-lbl">Attendance</div></div><div class="tile blue"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div></div>`;
}
async function loadModules(){
  try{
    const res=await fetch('/api/sessions?action=student-modules',{headers:{'x-student-id':student.portalId}});
    const data=await res.json();
    modules=data.modules||[]; sessions=data.sessions||[];
    renderModules(); loadStatCards();
  }catch(e){ document.getElementById('modules-wrap').innerHTML='<div class="empty">Could not load modules.</div>'; }
}
function renderModules(){
  const wrap=document.getElementById('modules-wrap');
  if(!modules.length){ wrap.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><div>No modules available yet. Check back soon!</div></div>'; return; }
  wrap.innerHTML=modules.map(m=>{
    const ss=sessions.filter(s=>s.moduleId===m.id).sort((a,b)=>(a.order||0)-(b.order||0));
    const rows=ss.length?ss.map(s=>{
      const lk=s.locked;
      return `<div class="sess ${lk?'locked':''}" ${lk?'':`onclick="openSession('${s.id}')"`}>
        <div class="sess-ic"><svg viewBox="0 0 24 24">${lk?'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'}</svg></div>
        <div class="info"><h4>${escapeHtml(s.title)}</h4><div class="meta">${s.hasPdf?'<span>PDF lesson</span>':''}${s.hasContent?'<span>Reading</span>':''}</div></div>
        ${lk?'<span class="pill pill-locked">Locked</span>':'<span class="sess-arrow">→</span>'}
      </div>`;
    }).join(''):'<div style="padding:16px 20px;color:var(--muted);font-size:13px">No sessions yet.</div>';
    return `<div class="module"><div class="module-head"><h3>${escapeHtml(m.title)}</h3>${m.description?`<p>${escapeHtml(m.description)}</p>`:''}</div>${rows}</div>`;
  }).join('');
}
async function loadAnnouncements(){
  try{
    const res=await fetch('/api/sessions?action=announcements',{headers:{'x-student-id':student.portalId}});
    const data=await res.json();
    const items=(data.announcements||[]).slice(0,3);
    document.getElementById('announce-wrap').innerHTML=items.map(a=>`<div class="announce"><svg viewBox="0 0 24 24"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg><div>${escapeHtml(a.text)}</div></div>`).join('');
  }catch(e){}
}

// ── Student tabs ───────────────────────────────────────────
const S_TAB_META={learn:['Learn','Your modules and sessions'],marks:['Marks','Your exam results & grade'],attendance:['Attendance','Your session attendance'],messages:['Messages','Chat with your teacher'],profile:['Profile','Your account details']};
function showStudentTab(tab,el){
  document.querySelectorAll('.snav-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.s-tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active'); else {const b=document.querySelector('.snav-btn[onclick*="\''+tab+'\'"]');if(b)b.classList.add('active');}
  document.getElementById('s-'+tab).classList.add('active');
  const m=S_TAB_META[tab]; if(m){document.getElementById('page-title').textContent=m[0];document.getElementById('page-sub').textContent=m[1];}
  if(tab==='marks') loadMarks();
  if(tab==='attendance') loadAttendance();
  if(tab==='messages') loadStudentMessages();
  if(tab==='profile') renderProfile();
  closeStudentSidebar();
}
function toggleStudentSidebar(){document.getElementById('s-sidebar').classList.toggle('open');document.getElementById('s-sb-backdrop').classList.toggle('show');}
function closeStudentSidebar(){var s=document.getElementById('s-sidebar');if(s)s.classList.remove('open');var b=document.getElementById('s-sb-backdrop');if(b)b.classList.remove('show');}
let _progress=null;
async function loadProgress(){
  try{ const res=await fetch('/api/sessions?action=my-progress',{headers:{'x-student-id':student.portalId}}); _progress=await res.json(); }catch(e){ _progress=null; }
  return _progress;
}
async function loadMarks(){
  const body=document.getElementById('marks-body');
  const p=await loadProgress();
  if(!p||!p.results){ body.innerHTML='<div class="empty">Could not load marks.</div>'; return; }
  const overall=p.overall;
  const ovColor=overall==null?'var(--muted)':(overall>=50?'var(--accent)':'var(--danger)');
  let html=`<div class="mk-card" style="text-align:center">
    <div style="font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em">Overall grade</div>
    <div style="font-family:'DM Serif Display',serif;font-size:44px;color:${ovColor};margin:6px 0">${overall==null?'—':overall+'%'}</div>
    <div style="font-size:12.5px;color:var(--muted)">${p.results.length} exam${p.results.length!==1?'s':''} taken</div>
  </div>`;
  if(!p.results.length){ html+='<div class="empty">No exam marks yet. Your marks will appear here after you take exams.</div>'; }
  else{
    html+='<div class="sec-label">Exam results</div>';
    html+=p.results.map(r=>{
      const col=r.passed?'var(--accent)':'var(--danger)';
      return `<div class="mk-card">
        <div class="mk-row"><div style="font-weight:600;font-size:14.5px">${escapeHtml(r.examTitle)}</div>
        <div style="font-weight:700;color:${col}">${r.score}/${r.total} · ${r.percent}%</div></div>
        <div class="mk-bar"><div class="mk-bar-fill" style="width:${r.percent}%;background:${col}"></div></div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:7px">${r.passed?'Passed':'Did not pass'} · pass mark ${r.passMark}%</div>
      </div>`;
    }).join('');
  }
  body.innerHTML=html;
}
async function loadAttendance(){
  const body=document.getElementById('attendance-body');
  const p=await loadProgress();
  if(!p||!p.attendance){ body.innerHTML='<div class="empty">Could not load attendance.</div>'; return; }
  let html=`<div class="mk-card" style="text-align:center">
    <div style="font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em">Attendance rate</div>
    <div style="font-family:'DM Serif Display',serif;font-size:44px;color:var(--accent);margin:6px 0">${p.attRate==null?'—':p.attRate+'%'}</div>
    <div style="font-size:12.5px;color:var(--muted)">${p.attendedCount} of ${p.totalSessions} sessions attended</div>
  </div>`;
  if(!p.attendance.length){ html+='<div class="empty">No sessions yet.</div>'; }
  else{
    html+='<div class="sec-label">Session attendance</div>';
    html+=p.attendance.map(a=>`<div class="mk-card"><div class="mk-row">
      <div style="font-weight:600;font-size:14px">${escapeHtml(a.title)}</div>
      ${a.present?'<span class="pill pill-open"><svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;stroke-width:2.5;fill:none"><path d="M20 6L9 17l-5-5"/></svg> Present</span>':'<span class="pill pill-locked">Absent</span>'}
    </div></div>`).join('');
  }
  body.innerHTML=html;
}
function renderProfile(){
  const s=student;
  document.getElementById('profile-body').innerHTML=`
    <div class="mk-card" style="text-align:center;padding:26px">
      <div style="width:76px;height:76px;border-radius:20px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;margin:0 auto 12px">${(s.name||'?').trim().charAt(0).toUpperCase()}</div>
      <div style="font-family:'DM Serif Display',serif;font-size:22px">${escapeHtml(s.name||'')}</div>
      <div style="font-family:monospace;color:var(--accent);font-weight:700;margin-top:4px">${escapeHtml(s.portalId||'')}</div>
    </div>
    <div class="mk-card">
      <div class="prof-row"><span class="k">Course</span><span class="v">${escapeHtml(s.courseLabel||s.course||'—')}</span></div>
      <div class="prof-row"><span class="k">Class type</span><span class="v">${s.classType==='online'?'Online':'In-Person'}</span></div>
      ${s.batchName?`<div class="prof-row"><span class="k">Batch</span><span class="v">${escapeHtml(s.batchName)}</span></div>`:''}
      <div class="prof-row"><span class="k">Student ID</span><span class="v" style="font-family:monospace">${escapeHtml(s.portalId||'')}</span></div>
    </div>`;
}
// ── Student messaging ──────────────────────────────────────
async function loadStudentMessages(){
  const el=document.getElementById('s-msg-bubbles');
  el.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;margin:auto">Loading…</div>';
  try{
    const res=await fetch('/api/sessions?action=messages',{headers:{'x-student-id':student.portalId}});
    const data=await res.json();
    const msgs=data.messages||[];
    if(!msgs.length){ el.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;margin:auto">No messages yet. Say hello to your teacher!</div>'; return; }
    el.innerHTML=msgs.map(m=>{
      const mine=m.from==='student';
      return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:78%">
        <div style="background:${mine?'var(--accent)':'var(--bg)'};color:${mine?'#fff':'var(--text)'};padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45">${escapeHtml(m.text)}</div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:3px;text-align:${mine?'right':'left'}">${mine?'You':'Teacher'} · ${m.at?new Date(m.at).toLocaleString():''}</div>
      </div>`;
    }).join('');
    el.scrollTop=el.scrollHeight;
  }catch(e){ el.innerHTML='<div class="empty">Could not load messages.</div>'; }
}
async function sendStudentMessage(){
  const inp=document.getElementById('s-msg-input'); const text=inp.value.trim();
  if(!text) return; inp.value='';
  try{
    await fetch('/api/sessions?action=message',{method:'POST',headers:{'Content-Type':'application/json','x-student-id':student.portalId},body:JSON.stringify({text})});
    loadStudentMessages();
  }catch(e){ alert('Could not send message'); }
}

// ── Session viewer with page-limited PDF ───────────────────
let pdfDoc=null, pdfPage=1, pdfMaxPage=1;
async function openSession(id){
  const overlay=document.getElementById('viewer-overlay');
  document.getElementById('v-content').style.display='none';
  document.getElementById('v-pdf').style.display='none';
  document.getElementById('v-att').style.display='none';
  document.getElementById('v-title').textContent='Loading…';
  overlay.classList.add('open');
  try{
    const res=await fetch('/api/sessions?action=open-session',{method:'POST',headers:{'Content-Type':'application/json','x-student-id':student.portalId},body:JSON.stringify({sessionId:id})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Could not open session');
    const s=data.session;
    document.getElementById('v-title').textContent=s.title;
    if(s.content){ const c=document.getElementById('v-content'); c.textContent=s.content; c.style.display='block'; }
    if(s.pdfUrl){ document.getElementById('v-pdf').style.display='block'; loadPdf(s.pdfUrl, s.pageLimit||0); }
  }catch(e){ document.getElementById('v-title').textContent='Error'; document.getElementById('v-content').style.display='block'; document.getElementById('v-content').textContent=e.message; }
}
function closeViewer(){ document.getElementById('viewer-overlay').classList.remove('open'); pdfDoc=null; }
async function loadPdf(url, limit){
  const noteEl=document.getElementById('pdf-limit-note');
  try{
    pdfDoc=await pdfjsLib.getDocument(url).promise;
    const total=pdfDoc.numPages;
    pdfMaxPage = limit>0 ? Math.min(limit, total) : total;
    pdfPage=1;
    if(limit>0 && limit<total){ noteEl.style.display='block'; noteEl.textContent=`Preview limited to ${pdfMaxPage} of ${total} pages by your teacher.`; }
    else noteEl.style.display='none';
    renderPdfPage();
  }catch(e){ document.getElementById('pdf-info').textContent='Could not load PDF'; }
}
async function renderPdfPage(){
  if(!pdfDoc) return;
  const page=await pdfDoc.getPage(pdfPage);
  const canvas=document.getElementById('pdf-canvas');
  const ctx=canvas.getContext('2d');
  const vp=page.getViewport({scale:1.4});
  canvas.width=vp.width; canvas.height=vp.height;
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  document.getElementById('pdf-info').textContent=`Page ${pdfPage} of ${pdfMaxPage}`;
  document.getElementById('pdf-prev').disabled=pdfPage<=1;
  document.getElementById('pdf-next').disabled=pdfPage>=pdfMaxPage;
}
function pdfPrev(){ if(pdfPage>1){ pdfPage--; renderPdfPage(); } }
function pdfNext(){ if(pdfPage<pdfMaxPage){ pdfPage++; renderPdfPage(); } }

// restore session
const saved=localStorage.getItem('studentPortalSession');
if(saved){ try{ student=JSON.parse(saved).student; if(student) showApp(); }catch(e){ localStorage.removeItem('studentPortalSession'); } }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghost Digitals Academy — Student Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--accent:#2d5a27;--accent-light:#edf5ec;--accent-text:#1e4019;--gold:#c4860a;--gold-light:#fdf6e3;--bg:#f8f9f7;--surface:#fff;--border:#e5e7e3;--text:#1a1a1a;--muted:#6b7280;--danger:#c0392b;--danger-light:#fdf0ee;--radius:10px;--radius-lg:14px;--shadow-sm:0 1px 3px rgba(20,40,15,.05);--shadow-md:0 8px 26px rgba(20,40,15,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
@media print{body{display:none!important}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block}
.alert-danger{background:var(--danger-light);color:var(--danger);border:1px solid #f0c0bb}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--accent);color:#fff;width:100%}
/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1a2d18 0%,#2d5a27 100%)}
.login-card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{width:60px;height:60px;margin:0 auto 14px;border-radius:16px;background:var(--accent-light);display:flex;align-items:center;justify-content:center}
.login-logo svg{width:32px;height:32px;stroke:var(--accent);stroke-width:2;fill:none}
.login-card h1{font-family:'DM Serif Display',serif;font-size:24px;color:var(--accent);margin-bottom:6px}
.login-card p{color:var(--muted);font-size:13px;margin-bottom:28px}
.login-card input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:16px;text-align:center;letter-spacing:2px;font-weight:600;margin-bottom:16px;outline:none}
.login-card input:focus{border-color:var(--accent)}
/* Header */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar .who{display:flex;align-items:center;gap:12px}
.topbar .av{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.topbar .nm{font-weight:700;font-size:15px}
.topbar .id{font-size:12px;color:var(--muted);font-family:monospace}
.logout{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.logout:hover{color:var(--danger);border-color:var(--danger)}
.wrap{max-width:900px;margin:0 auto;padding:26px 22px}
.hero{background:linear-gradient(135deg,#2d5a27,#1e4019);border-radius:var(--radius-lg);padding:24px;color:#fff;margin-bottom:24px}
.hero h2{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:4px}
.hero p{font-size:13.5px;opacity:.85}
.announce{background:var(--gold-light);border:1px solid #f0e0b0;border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px}
.announce svg{width:18px;height:18px;stroke:var(--gold);stroke-width:2;fill:none;flex-shrink:0;margin-top:1px}
.sec-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:24px 0 12px}
.module{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.module-head{padding:16px 20px;border-bottom:1px solid var(--border)}
.module-head h3{font-size:16px;font-weight:700}
.module-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
.sess{display:flex;align-items:center;gap:13px;padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.sess:last-child{border-bottom:none}
.sess:hover{background:var(--bg)}
.sess.locked{opacity:.55;cursor:not-allowed}
.sess-ic{width:40px;height:40px;border-radius:11px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sess-ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.sess .info{flex:1;min-width:0}
.sess .info h4{font-size:14.5px;font-weight:600}
.sess .info .meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px}
.sess-arrow{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.pill-locked{background:#f3f4f6;color:#6b7280}
.pill-open{background:var(--accent-light);color:var(--accent-text)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;stroke:#c9d2c2;stroke-width:1.5;fill:none;margin-bottom:10px}
/* Session viewer overlay */
.overlay{position:fixed;inset:0;background:rgba(15,20,12,.6);z-index:100;display:none;align-items:stretch;justify-content:center}
.overlay.open{display:flex}
.viewer{background:var(--bg);width:100%;max-width:1000px;display:flex;flex-direction:column;height:100vh}
.viewer-head{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.viewer-head .back{background:none;border:1px solid var(--border);padding:8px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
.viewer-head h3{font-size:16px;font-weight:700;flex:1}
.att-badge{background:var(--accent-light);color:var(--accent-text);padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.att-badge svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.5;fill:none}
.viewer-body{flex:1;overflow-y:auto;padding:22px}
.content-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:18px;line-height:1.65;font-size:14.5px;white-space:pre-wrap}
.pdf-wrap{background:#525659;border-radius:var(--radius-lg);overflow:hidden}
.pdf-bar{background:#323639;padding:9px 16px;display:flex;align-items:center;gap:10px}
.pdf-bar span{color:rgba(255,255,255,.75);font-size:12.5px}
.pdf-bar button{background:rgba(255,255,255,.12);color:#fff;border:none;padding:6px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit}
.pdf-bar button:hover{background:rgba(255,255,255,.22)}
.pdf-bar button:disabled{opacity:.4;cursor:not-allowed}
.pdf-canvas-wrap{display:flex;justify-content:center;padding:18px;min-height:300px}
.pdf-canvas-wrap canvas{max-width:100%;box-shadow:0 4px 20px rgba(0,0,0,.4);height:auto}
.limit-note{text-align:center;color:var(--gold);font-size:12.5px;padding:10px;background:rgba(196,134,10,.08)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo"><svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/></svg></div>
      <h1>Student Portal</h1>
      <p>Ghost Digitals Academy</p>
      <div class="alert alert-danger" id="login-alert"></div>
      <input type="text" id="portal-id-input" placeholder="GDA-XXXXXX" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')login()">
      <button class="btn btn-primary" onclick="login()"><span id="login-text">Enter Portal</span><div class="spinner" id="login-spinner"></div></button>
    </div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <div class="topbar">
    <div class="who">
      <div class="av" id="h-av">S</div>
      <div><div class="nm" id="h-name">Student</div><div class="id" id="h-id">GDA-000000</div></div>
    </div>
    <button class="logout" onclick="logout()">Sign out</button>
  </div>
  <div class="wrap">
    <div class="hero"><h2 id="hero-title">Welcome back!</h2><p id="hero-sub">Continue learning through your modules below.</p></div>
    <div id="announce-wrap"></div>
    <div class="sec-label">Your Modules</div>
    <div id="modules-wrap"><div class="empty">Loading…</div></div>
  </div>
</div>

<!-- Session viewer -->
<div class="overlay" id="viewer-overlay">
  <div class="viewer">
    <div class="viewer-head">
      <button class="back" onclick="closeViewer()">← Back</button>
      <h3 id="v-title">Session</h3>
      <span class="att-badge" id="v-att" style="display:none"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> Attendance marked</span>
    </div>
    <div class="viewer-body">
      <div id="v-content" class="content-box" style="display:none"></div>
      <div id="v-pdf" class="pdf-wrap" style="display:none">
        <div class="pdf-bar">
          <span id="pdf-info">Page 1</span>
          <span style="flex:1"></span>
          <button id="pdf-prev" onclick="pdfPrev()">◀ Prev</button>
          <button id="pdf-next" onclick="pdfNext()">Next ▶</button>
        </div>
        <div class="pdf-canvas-wrap"><canvas id="pdf-canvas"></canvas></div>
        <div class="limit-note" id="pdf-limit-note" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
function escapeHtml(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function showAlert(el,msg){el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4000);}
let student=null, modules=[], sessions=[];

async function login(){
  const portalId=document.getElementById('portal-id-input').value.trim().toUpperCase();
  const alertEl=document.getElementById('login-alert');
  const txt=document.getElementById('login-text'), sp=document.getElementById('login-spinner');
  if(!portalId){ showAlert(alertEl,'Please enter your Student ID'); return; }
  txt.textContent='Entering…'; sp.style.display='block';
  try{
    const res=await fetch('/api/sessions?action=portal-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({portalId})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Student ID not found');
    student=data.student;
    localStorage.setItem('studentPortalSession',JSON.stringify({student}));
    showApp();
  }catch(e){ showAlert(alertEl,e.message); }
  txt.textContent='Enter Portal'; sp.style.display='none';
}
function logout(){ student=null; localStorage.removeItem('studentPortalSession'); document.getElementById('login-screen').style.display=''; document.getElementById('app-screen').style.display='none'; }
function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='';
  document.getElementById('h-name').textContent=student.name;
  document.getElementById('h-id').textContent=student.portalId;
  document.getElementById('h-av').textContent=(student.name||'?').trim().charAt(0).toUpperCase();
  document.getElementById('hero-title').textContent='Welcome back, '+(student.name||'').split(' ')[0]+'!';
  document.getElementById('hero-sub').textContent=(student.courseLabel||'Your course')+' · continue through your modules below.';
  loadModules(); loadAnnouncements();
}
async function loadModules(){
  try{
    const res=await fetch('/api/sessions?action=student-modules',{headers:{'x-student-id':student.portalId}});
    const data=await res.json();
    modules=data.modules||[]; sessions=data.sessions||[];
    renderModules();
  }catch(e){ document.getElementById('modules-wrap').innerHTML='<div class="empty">Could not load modules.</div>'; }
}
function renderModules(){
  const wrap=document.getElementById('modules-wrap');
  if(!modules.length){ wrap.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><div>No modules available yet. Check back soon!</div></div>'; return; }
  wrap.innerHTML=modules.map(m=>{
    const ss=sessions.filter(s=>s.moduleId===m.id).sort((a,b)=>(a.order||0)-(b.order||0));
    const rows=ss.length?ss.map(s=>{
      const lk=s.locked;
      return `<div class="sess ${lk?'locked':''}" ${lk?'':`onclick="openSession('${s.id}')"`}>
        <div class="sess-ic"><svg viewBox="0 0 24 24">${lk?'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'}</svg></div>
        <div class="info"><h4>${escapeHtml(s.title)}</h4><div class="meta">${s.hasPdf?'<span>PDF lesson</span>':''}${s.hasContent?'<span>Reading</span>':''}</div></div>
        ${lk?'<span class="pill pill-locked">Locked</span>':'<span class="sess-arrow">→</span>'}
      </div>`;
    }).join(''):'<div style="padding:16px 20px;color:var(--muted);font-size:13px">No sessions yet.</div>';
    return `<div class="module"><div class="module-head"><h3>${escapeHtml(m.title)}</h3>${m.description?`<p>${escapeHtml(m.description)}</p>`:''}</div>${rows}</div>`;
  }).join('');
}
async function loadAnnouncements(){
  try{
    const res=await fetch('/api/sessions?action=announcements',{headers:{'x-student-id':student.portalId}});
    const data=await res.json();
    const items=(data.announcements||[]).slice(0,3);
    document.getElementById('announce-wrap').innerHTML=items.map(a=>`<div class="announce"><svg viewBox="0 0 24 24"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg><div>${escapeHtml(a.text)}</div></div>`).join('');
  }catch(e){}
}

// ── Session viewer with page-limited PDF ───────────────────
let pdfDoc=null, pdfPage=1, pdfMaxPage=1;
async function openSession(id){
  const overlay=document.getElementById('viewer-overlay');
  document.getElementById('v-content').style.display='none';
  document.getElementById('v-pdf').style.display='none';
  document.getElementById('v-att').style.display='none';
  document.getElementById('v-title').textContent='Loading…';
  overlay.classList.add('open');
  try{
    const res=await fetch('/api/sessions?action=open-session',{method:'POST',headers:{'Content-Type':'application/json','x-student-id':student.portalId},body:JSON.stringify({sessionId:id})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Could not open session');
    const s=data.session;
    document.getElementById('v-title').textContent=s.title;
    document.getElementById('v-att').style.display='inline-flex'; // auto-marked server-side
    if(s.content){ const c=document.getElementById('v-content'); c.textContent=s.content; c.style.display='block'; }
    if(s.pdfUrl){ document.getElementById('v-pdf').style.display='block'; loadPdf(s.pdfUrl, s.pageLimit||0); }
  }catch(e){ document.getElementById('v-title').textContent='Error'; document.getElementById('v-content').style.display='block'; document.getElementById('v-content').textContent=e.message; }
}
function closeViewer(){ document.getElementById('viewer-overlay').classList.remove('open'); pdfDoc=null; }
async function loadPdf(url, limit){
  const noteEl=document.getElementById('pdf-limit-note');
  try{
    pdfDoc=await pdfjsLib.getDocument(url).promise;
    const total=pdfDoc.numPages;
    pdfMaxPage = limit>0 ? Math.min(limit, total) : total;
    pdfPage=1;
    if(limit>0 && limit<total){ noteEl.style.display='block'; noteEl.textContent=`Preview limited to ${pdfMaxPage} of ${total} pages by your teacher.`; }
    else noteEl.style.display='none';
    renderPdfPage();
  }catch(e){ document.getElementById('pdf-info').textContent='Could not load PDF'; }
}
async function renderPdfPage(){
  if(!pdfDoc) return;
  const page=await pdfDoc.getPage(pdfPage);
  const canvas=document.getElementById('pdf-canvas');
  const ctx=canvas.getContext('2d');
  const vp=page.getViewport({scale:1.4});
  canvas.width=vp.width; canvas.height=vp.height;
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  document.getElementById('pdf-info').textContent=`Page ${pdfPage} of ${pdfMaxPage}`;
  document.getElementById('pdf-prev').disabled=pdfPage<=1;
  document.getElementById('pdf-next').disabled=pdfPage>=pdfMaxPage;
}
function pdfPrev(){ if(pdfPage>1){ pdfPage--; renderPdfPage(); } }
function pdfNext(){ if(pdfPage<pdfMaxPage){ pdfPage++; renderPdfPage(); } }

// restore session
const saved=localStorage.getItem('studentPortalSession');
if(saved){ try{ student=JSON.parse(saved).student; if(student) showApp(); }catch(e){ localStorage.removeItem('studentPortalSession'); } }
</script>
</body>
</html>
